<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de preview · Eli 13</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: system-ui, sans-serif; background: #1d1620; color: #eee; margin: 0; padding: 24px 16px 60px; text-align: center; }
  h1 { font-size: 1.1rem; font-weight: 500; margin: 0 0 14px; }
  canvas { width: min(100%, 1200px); height: auto; border-radius: 10px; box-shadow: 0 14px 50px #000a; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 18px 0 10px; }
  button, label.btn { background: linear-gradient(135deg, #7b2d5b, #b04a8f); color: #fff; border: 0; border-radius: 999px; padding: 12px 26px; font-size: 1rem; cursor: pointer; }
  label.btn.ghost { background: transparent; border: 1.5px solid #b04a8f; }
  #info { color: #bda8c4; font-size: .9rem; min-height: 1.4em; }
</style>
</head>
<body>
<h1>Vista previa 1200 × 630 para WhatsApp, Facebook y más</h1>
<canvas id="c" width="1200" height="630"></canvas>
<div class="row">
  <label class="btn ghost">Elegir otra foto<input id="file" type="file" accept="image/*" hidden></label>
  <button id="dl" type="button">Descargar preview.jpg</button>
</div>
<p id="info">Cargando…</p>

<script>
const W = 1200, H = 630;
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const info = document.getElementById('info');
const DEFAULT_PHOTO = 'img/katha-y-papa.jpeg';
let photo = null;

function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = src;
  });
}

function blob(x, y, r, col) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function sparkle(x, y, s, a) {
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#c9a24b';
  ctx.font = s + 'px "Cormorant Garamond", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✦', x, y);
  ctx.restore();
}

async function draw() {
  await Promise.all([
    document.fonts.load('600 250px "Cormorant Garamond"'),
    document.fonts.load('italic 500 38px "Cormorant Garamond"'),
    document.fonts.load('100px "Great Vibes"'),
    document.fonts.load('400 24px Jost')
  ]);

  // Fondo
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#fff7f9');
  bg.addColorStop(.55, '#f6ecfb');
  bg.addColorStop(1, '#fdf3ee');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  blob(0, 0, 460, 'rgba(255,211,224,.95)');
  blob(W, H, 520, 'rgba(227,208,251,.95)');
  blob(W * .66, H * .1, 300, 'rgba(251,232,184,.75)');

  // Marco dorado
  ctx.strokeStyle = 'rgba(201,162,75,.6)';
  ctx.lineWidth = 2;
  roundRect(24, 24, W - 48, H - 48, 20);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(201,162,75,.28)';
  roundRect(36, 36, W - 72, H - 72, 14);
  ctx.stroke();

  // Foto circular
  const cx = 300, cy = 315, r = 205;
  ctx.save();
  ctx.shadowColor = 'rgba(123,45,91,.35)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 14;
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.arc(cx, cy, r + 16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
  if (photo) {
    const s = Math.max(2 * r / photo.width, 2 * r / photo.height);
    const dw = photo.width * s, dh = photo.height * s;
    ctx.drawImage(photo, cx - dw / 2, cy - r - (dh - 2 * r) * .28, dw, dh);
  } else {
    ctx.fillStyle = '#eadcfa';
    ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
    ctx.fillStyle = '#7b2d5b';
    ctx.font = '500 34px Jost, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Elige una foto', cx, cy + 10);
  }
  ctx.restore();

  const ring = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
  ring.addColorStop(0, '#f1d98a'); ring.addColorStop(.5, '#c9a24b'); ring.addColorStop(1, '#a07a28');
  ctx.strokeStyle = ring;
  ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(cx, cy, r + 4, 0, Math.PI * 2); ctx.stroke();

  // Textos
  const X = 840;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = '#6d5a73';
  ctx.font = 'italic 500 38px "Cormorant Garamond", Georgia, serif';
  ctx.fillText('Hoy comienza', X, 140);

  const gold = ctx.createLinearGradient(0, 160, 0, 400);
  gold.addColorStop(0, '#f1d98a'); gold.addColorStop(.45, '#c9a24b'); gold.addColorStop(.75, '#a07a28'); gold.addColorStop(1, '#f1d98a');
  ctx.save();
  ctx.shadowColor = 'rgba(201,162,75,.45)';
  ctx.shadowBlur = 26;
  ctx.shadowOffsetY = 8;
  ctx.fillStyle = gold;
  ctx.font = '600 270px "Cormorant Garamond", Georgia, serif';
  ctx.fillText('13', X, 385);
  ctx.restore();

  ctx.fillStyle = '#7b2d5b';
  ctx.font = '104px "Great Vibes", cursive';
  ctx.fillText('Eli Kathaleia', X, 485);

  ctx.fillStyle = '#6d5a73';
  ctx.font = 'italic 500 38px "Cormorant Garamond", Georgia, serif';
  ctx.fillText('Tu era dorada empieza hoy 🌸', X, 548);

  sparkle(610, 100, 30, .8); sparkle(1090, 130, 26, .7);
  sparkle(1110, 420, 34, .6); sparkle(585, 560, 24, .7); sparkle(1040, 575, 22, .6);

  info.textContent = 'Listo. Si te gusta, descárgalo y súbelo como preview.jpg a la raíz del repositorio.';
}

function blobAt(q) {
  return new Promise(res => c.toBlob(res, 'image/jpeg', q));
}

document.getElementById('dl').addEventListener('click', async () => {
  try {
    let q = .92, b = await blobAt(q);
    while (b && b.size > 280 * 1024 && q > .5) { q -= .06; b = await blobAt(q); }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'preview.jpg';
    a.click();
    info.textContent = 'preview.jpg descargado · ' + Math.round(b.size / 1024) + ' KB';
  } catch (e) {
    info.textContent = 'No se pudo exportar. Abre esta página desde tu sitio publicado o con Live Server (no con doble clic en el archivo).';
  }
});

document.getElementById('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  photo = await loadImg(URL.createObjectURL(f));
  draw();
});

loadImg(DEFAULT_PHOTO).then(i => photo = i).catch(() => photo = null).then(draw);
</script>
</body>
</html>
